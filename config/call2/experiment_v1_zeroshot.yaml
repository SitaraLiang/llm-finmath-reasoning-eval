    enabled: false
    parameters:
      temperature: 0.0
      max_output_tokens: 800

  - id: "mistral:7b"
    provider: "ollama"
    enabled: false
    parameters:
      temperature: 0.0
      max_output_tokens: 800
  
  - id: "qwen2.5:7b"
    enabled: false
    parameters:
      temperature: 0.0
      max_output_tokens: 800

  - id: "qwen2.5-coder:7b"
    enabled: false
    parameters:
      temperature: 0.0
      max_output_tokens: 800

  - id: "llama3.1:8b"
    provider: "ollama"
    enabled: true
    parameters:
      temperature: 0.0
      max_output_tokens: 800

  - id: "qwen3:8b"
    provider: "ollama"
    enabled: true
