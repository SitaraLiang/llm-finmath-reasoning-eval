experiment:
  name: "financial_math_call2_zeroshot_v1"
  version: 1
  seed: 42

input:
  root_directory: "outputs/call1/plain_text"

  filters:
    # Leave empty or omit to accept every Call 1 model found under
    # outputs/call1/plain_text/{model}/{language}/{variation}/.
    models: []

    languages:
      - "en"
      - "fr"

    variations:
      - "baseline"

    # Leave empty or omit to accept every prompt type found in the Call 1 file.
    prompt_types:
      - "strictly_sequential"
      - "prompt_accumulation"
      - "ground_truth_forcing"
      - "self_history"

output:
  directory_template: "{model1}/{model2}/{language}/{variation}"
  filename_template: "pc{pc}_q{exercise}_{prompt_type_abbrev}.yaml"
  overwrite_existing: false
  save_raw_response: true
  save_prompt: false

prompts:
  per_question_conversion: |
    /no_think
    TASK: Convert this SINGLE Question block into the proof-atom YAML format.
    Return only the atoms structure for this one Question block.

    CRITICAL OUTPUT RULES:
    - Do not output thinking, reasoning traces, analysis, explanations, or notes.
    - Do not output text inside <think> tags.
    - Return EXACTLY ONE Markdown code block tagged yml.
    - The response MUST START with ```yml and END with ```.
    - Do not write any text before or after the code block.
    - Inside the code block, return exactly one YAML document.
    - Do not use YAML document separators such as --- or ...
    - The first non-empty line inside the code block must be exactly:
      atoms:
    - Do not output subquestions. Python will assemble subquestions after each
      Question block is converted.
    - Do not solve the exercise again. Only structure the answer text in the
      SOURCE ANSWER.
    - Do not include fields other than atoms, preconditions, arguments,
      outcomes, and optional strength.

    PROOF-ATOM YAML FORMAT:
    - Top-level:
        atoms: ...
    - The atoms field may contain one atom mapping, an ordered YAML list of atom
      mappings, a !!python/tuple for an unordered mathematical set, or nested
      lists and tuples.
    - Every atom MUST be one mapping with at least these required fields:
        preconditions: ordered list of strings
        arguments: ordered list of strings
        outcomes: ordered list of strings
    - Under atoms, each "-" begins one complete atom. Do NOT write
      "- arguments:" or "- outcomes:" under atoms.
    - Correct:
        atoms:
        - preconditions:
          - "P"
          arguments:
          - "Calculation"
          outcomes:
          - "O"
    - Incorrect:
        atoms:
        - preconditions:
          - "P"
        - arguments:
          - "Calculation"
        - outcomes:
          - "O"
    - Use preconditions: [] when no preconditions are stated.
    - Use outcomes: [] only if no outcome is stated.
    - Never use [] for arguments; arguments must always contain at least one item.
    - Never put strings inside square brackets. Use block-style lists.
    - Use "Calculation" only when the argument is mainly computation or
      algebraic/probabilistic calculation.
    - If the argument is mainly computation, use exactly:
        arguments:
        - Calculation
    - If the argument is not mainly computation, do NOT use "Calculation"; write
      the actual theorem, idea, definition, or method as a string.
    - Do not repeat Calculation multiple times inside the same arguments list.
    - Use !!python/tuple for alternative unordered proof branches or unordered
      groups of atoms.
    - Preserve LaTeX and mathematical symbols in strings.
    - Quote any string containing braces, brackets, colons, commas, backslashes,
      or LaTeX expressions.
    - Do not invent proof facts not present in the source answer.
    - Do not repeat identical atoms.

    CURRENT METADATA:
    pc: $pc
    exercise: $exercise
    language: $language
    variation: $variation
    prompt_type: $prompt_type
    call1_model: $model1
    call1_output_mode: $call1_output_mode
    question_block_index: $question_block_index
    question_block_count: $question_block_count

    SOURCE ANSWER:
    $source_answer

    YAML OUTPUT:

  repair: |
    TASK: Repair the previous response into the proof-atom YAML format.

    Error:
    $error_message

    CRITICAL OUTPUT RULES:
    - Do not output thinking, reasoning traces, analysis, explanations, or notes.
    - Return exactly one Markdown code block tagged yml.
    - The response must start with ```yml and end with ```.
    - Do not write any text before or after the code block.
    - Inside the code block, return exactly one YAML document.
    - Do not use YAML document separators such as --- or ...
    - The first non-empty line inside the code block must be exactly:
      atoms:
    - Do not write explanations, titles, name, description, version, parameters,
      scenarios, or generic benchmark configuration.
    - Each atom must have preconditions, arguments, and outcomes.
    - Use !!python/tuple only for unordered mathematical sets.
    - Quote strings containing braces, brackets, colons, commas, backslashes, or
      LaTeX expressions.

    Previous response and original task:
    $raw_response

  # French inputs use French instructions. English uses the default templates.
  languages:
    fr:
      per_question_conversion: |
        /no_think
        TACHE : Convertissez ce SEUL bloc Question au format YAML d'atomes de
        preuve. Python assemblera ensuite les subquestions.

        REGLES DE SORTIE OBLIGATOIRES :
        - Ne produisez aucune analyse, reflexion, explication, note ou balise
          <think>.
        - Retournez exactement un bloc Markdown commencant par ```yml et se
          terminant par ```, sans texte avant ou apres.
        - Le bloc contient un seul document YAML, sans --- ni ....
        - La premiere ligne non vide doit etre exactement :
          atoms:
        - Ne produisez pas le champ subquestions.
        - Ne resolvez pas l'exercice : structurez uniquement la REPONSE SOURCE.
        - N'utilisez que atoms, preconditions, arguments, outcomes et strength.

        FORMAT :
        - atoms peut etre un atome, une liste ordonnee, un !!python/tuple non
          ordonne, ou une imbrication de listes et tuples.
        - Chaque atome est un mapping complet avec preconditions, arguments et
          outcomes au meme niveau d'indentation.
        - Ces champs sont des listes YAML en style bloc, jamais des listes en ligne
          comme ["..."] lorsqu'elles ne sont pas vides.
        - Chaque "-" directement sous atoms commence un atome complet. Ne separez
          jamais preconditions, arguments et outcomes en plusieurs elements.
        - preconditions: [] et outcomes: [] sont admis uniquement lorsqu'ils sont
          vides. arguments doit toujours contenir au moins une chaine.
        - Utilisez "Calculation" seulement pour une etape principalement
          calculatoire. Sinon, indiquez le theoreme, la definition, la propriete ou
          la methode employee.
        - Utilisez !!python/tuple uniquement pour les alternatives ou groupes non
          ordonnes.
        - Conservez exactement les formules de la source et mettez entre guillemets
          les chaines contenant de la syntaxe LaTeX ou YAML speciale.
        - N'inventez aucun fait et ne dupliquez aucun atome.

        METADONNEES :
        pc: $pc
        exercise: $exercise
        language: $language
        variation: $variation
        prompt_type: $prompt_type
        call1_model: $model1
        question_block_index: $question_block_index
        question_block_count: $question_block_count

        REPONSE SOURCE :
        $source_answer

        SORTIE YAML :

      repair: |
        TACHE : Reparez la reponse precedente afin d'obtenir un YAML d'atomes de
        preuve valide.

        Erreur de validation :
        $error_message

        REGLES OBLIGATOIRES :
        - Retournez uniquement un bloc ```yml ... ```, sans analyse ni texte avant
          ou apres.
        - Conservez la cle de niveau superieur demandee par la tache originale :
          atoms pour un seul bloc Question, ou subquestions pour l'exercice entier.
        - Produisez un seul document YAML, sans --- ni ....
        - Chaque atome doit contenir preconditions, arguments et outcomes.
        - arguments ne doit jamais etre vide.
        - Utilisez !!python/tuple uniquement pour un ensemble mathematique non
          ordonne.
        - Conservez exactement les formules et mettez entre guillemets les chaines
          contenant de la syntaxe LaTeX ou YAML speciale.
        - Corrigez uniquement l'erreur indiquee; n'ajoutez aucun fait.

        Reponse precedente et tache originale :
        $raw_response

conversion:
  mode: "per_question"
  repair:
    max_attempts: 1

