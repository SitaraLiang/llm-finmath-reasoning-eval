output_modes:
  - "plain_text"

prompts:
  languages:
    en:
      empty_value: "none"
      labels:
        question: "Question"
        exact_solution: "Exact solution"
        your_answer: "Your answer"
      common_header: |
        $variation_instruction
        You are solving a financial mathematics exercise.
        Write a concise rigorous mathematical answer in English. Do not include hidden reasoning or long explanations. Use LaTeX for formulas.

        Context:
        $context

        Global assumptions:
        $global_assumptions
      strategies:
        strictly_sequential: |
          Local assumptions:
          $current_assumptions

          Question $current_question_number:
          $current_question

          Answer only Question $current_question_number.
        prompt_accumulation: |
          Questions provided so far:
          $accumulated_questions

          Answer only Question $current_question_number.
        ground_truth_forcing: |
          Previous questions and exact solutions:
          $ground_truth_history

          Local assumptions:
          $current_assumptions

          Current question $current_question_number:
          $current_question

          Answer only Question $current_question_number.
        self_history: |
          Previous questions and your previous answers:
          $self_history

          Local assumptions:
          $current_assumptions

          Current question $current_question_number:
          $current_question

          Answer only Question $current_question_number.
    fr:
      empty_value: "aucune"
      labels:
        question: "Question"
        exact_solution: "Solution exacte"
        your_answer: "Votre réponse"
      common_header: |
        $variation_instruction
        Vous résolvez un exercice de mathématiques financières.
        Rédigez en français une réponse mathématique concise et rigoureuse. N'incluez pas de raisonnement caché ni de longues explications. Utilisez LaTeX pour les formules.

        Contexte :
        $context

        Hypothèses globales :
        $global_assumptions
      strategies:
        strictly_sequential: |
          Hypothèses locales :
          $current_assumptions

          Question $current_question_number :
          $current_question

          Répondez uniquement à la question $current_question_number.
        prompt_accumulation: |
          Questions fournies jusqu'à présent :
          $accumulated_questions

          Répondez uniquement à la question $current_question_number.
        ground_truth_forcing: |
          Questions précédentes et solutions exactes :
          $ground_truth_history

          Hypothèses locales :
          $current_assumptions

          Question actuelle $current_question_number :
          $current_question

          Répondez uniquement à la question $current_question_number.
        self_history: |
          Questions précédentes et vos réponses précédentes :
          $self_history

          Hypothèses locales :
          $current_assumptions

          Question actuelle $current_question_number :
          $current_question

          Répondez uniquement à la question $current_question_number.
    ch:
      empty_value: "无"
      labels:
        question: "问题"
        exact_solution: "标准答案"
        your_answer: "你的回答"
      common_header: |
        $variation_instruction
        你正在解答一道金融数学题。
        请用中文给出简洁、严谨的数学答案。不要输出隐藏的推理过程或冗长解释。公式请使用 LaTeX。

        题目背景：
        $context

        全局假设：
        $global_assumptions
      strategies:
        strictly_sequential: |
          局部假设：
          $current_assumptions

          第 $current_question_number 问：
          $current_question

          只回答第 $current_question_number 问。
        prompt_accumulation: |
          到目前为止给出的问题：
          $accumulated_questions

          只回答第 $current_question_number 问。
        ground_truth_forcing: |
          前面的问题及其标准答案：
          $ground_truth_history

          局部假设：
          $current_assumptions

          当前第 $current_question_number 问：
          $current_question

          只回答第 $current_question_number 问。
        self_history: |
          前面的问题及你之前的回答：
          $self_history

          局部假设：
          $current_assumptions

          当前第 $current_question_number 问：
          $current_question

          只回答第 $current_question_number 问。
