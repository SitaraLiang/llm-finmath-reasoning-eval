experiment:
  name: "financial_math_evaluation_judge_v1"
  version: 1
  seed: 42

input:
  predictions: "outputs/selected_responses"
  ground_truth: "data/ground_truth"

# Keep missing Call 1/Call 2 cases visible in coverage and end-to-end scores.
expected:
  models:
    - "tinyllama"
    - "llama3.2-1b"
    - "deepseek-r1-1.5b"
    - "qwen2.5-coder-0.5b"
    - "qwen3-0.6b"
    - "llama3.1-8b"
    - "deepseek-r1-7b"
  languages:
    - "en"
    - "fr"
  variations:
    - "baseline"
  strategies:
    - "seq"
    - "acc"
    - "gtf"
    - "self"

output:
  # evaluate.py appends {language}/{variation}/{with_judge|embedding_only}.
  root_directory: "outputs/evaluation/parsed_responses"
  overwrite_existing: false

embedding:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  # Fallback for a language not listed below.
  threshold: 0.4
  # Replace each value with the threshold calibrated on that language's pairs.
  thresholds:
    en: 0.375
    fr: 0.45

judge:
  enabled: false
  model: "llama3.1:8b"
  endpoint: "http://localhost:11434/api/generate"
  timeout_seconds: 120
  temperature: 0.0

  # Very low embedding scores are rejected automatically. All remaining
  # candidates are judged because embeddings do not reliably separate
  # equivalent from related-but-not-equivalent statements.
  low_threshold: 0.30
  high_threshold: 1.0
  thresholds:
    en:
      low: 0.30
      high: 1.0
    fr:
      low: 0.35
      high: 1.0

prompts:
  judge: |
    /no_think
    You are a strict mathematical equivalence judge for a financial mathematics benchmark.

    You compare one ground-truth statement with one statement extracted from a model answer.
    The goal is NOT to solve the exercise again. The goal is only to decide whether the
    model statement covers the mathematical content of the ground-truth statement.

    Dimension:
    $dimension

    Field:
    $field

    Ground-truth statement:
    $gt_text

    Model statement:
    $model_text

    Labels:
    - equivalent: the model statement fully expresses the same mathematical content,
      possibly with different wording or notation.
    - related_but_not_equivalent: both statements concern the same mathematical topic,
      but the model statement is incomplete, weaker, stronger, contradictory, or
      otherwise mathematically different from the ground truth.
    - unrelated: the model statement is about a different mathematical fact.

    Rules:
    - Be conservative. Use equivalent only when the mathematical content is really the same.
    - Do not reward a statement just because it uses similar words.
    - If the model statement is broader, weaker, missing a hypothesis, contradictory,
      or mathematically incorrect but on the same topic, use related_but_not_equivalent.
    - Return only YAML. Do not add prose before or after the YAML.
    
    Return exactly:
    label: equivalent|related_but_not_equivalent|unrelated
    confidence: 0.0-1.0
    reason: one short sentence
