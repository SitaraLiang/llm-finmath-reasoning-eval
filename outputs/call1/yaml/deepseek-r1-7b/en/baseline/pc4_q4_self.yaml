subquestions:
-   atoms:
    -   preconditions:
        - τ is a bounded stopping time
        arguments:
        - W_t is a martingale (Brownian motion)
        - Optional Stopping Theorem applies for bounded stopping times
        - E[W_τ] = E[W_0]
        outcomes:
        - W_0 = 0
        - Therefore, E[W_τ] = 0
-   atoms:
    -   preconditions:
        - τ is a bounded stopping time
        arguments:
        - W_t^2 - t is a martingale (from Itô's formula)
        - Optional Stopping Theorem applies for bounded stopping times
        - E[W_τ² - τ] = E[W_0²]
        - W_0 = 0, so E[W_0²] = 0
        outcomes:
        - Therefore, E[W_τ²] = E[τ]
