subquestions:
-   atoms:
    -   preconditions:
        - τ is a bounded stopping time
        arguments:
        - W_t is a Brownian motion, which is a martingale
        - The Optional Stopping Theorem applies to bounded stopping times for martingales
        - E[W_τ] = E[W_0]
        outcomes:
        - W_0 = 0 (since Brownian motion starts at zero)
        - Therefore, E[W_τ] = 0
-   atoms:
    -   preconditions:
        - τ is a bounded stopping time
        arguments:
        - W_t is a Brownian motion and W_t² - t is a martingale
        - The process W_t² - t is a martingale, so by optional stopping theorem E[W_τ²
            - τ] = E[0]
        outcomes:
        - Therefore, \(\E(W_\tau^2) = \E(\tau)\)
