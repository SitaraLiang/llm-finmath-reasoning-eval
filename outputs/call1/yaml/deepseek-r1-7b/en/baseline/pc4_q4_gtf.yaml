subquestions:
-   atoms:
    -   preconditions:
        - τ is a bounded stopping time
        arguments:
        - W_t is a martingale (specifically Brownian motion)
        - Optional Stopping Theorem applies for bounded stopping times
        - E[W_τ] = W_0 due to the martingale property
        outcomes:
        - W_0 = 0 for standard Brownian motion
-   atoms:
    -   preconditions:
        - τ is a bounded stopping time
        arguments:
        - Apply optional stopping theorem to M_t = W_t² - t at τ
        outcomes:
        - E[W_τ²] = E[τ]
