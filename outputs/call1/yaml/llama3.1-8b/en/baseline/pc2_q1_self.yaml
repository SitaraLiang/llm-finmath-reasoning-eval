subquestions:
-   atoms:
    -   preconditions:
        - A process $(X_t)_{t\in \R^+}$ is given.
        arguments:
        - 'The process has the following properties: $X_0=0$, it is a centered Gaussian
            process, and ${\rm Cov}(X_s,X_t)=\inf(s,t)$ for all $s,t\in \R^+$'
        outcomes:
        - $X_t$ is a Brownian motion for all $t\in \R^+$
    -   preconditions:
        - A process $(X_t)_{t\in \R^+}$ is a Brownian motion.
        arguments:
        - Calculation
        outcomes:
        - $X_0=0$
        - $(X_t)_{t\in \R^+}$ is a centered Gaussian process
        - ${\rm Cov}(X_s,X_t)=\inf(s,t)$ for all $s,t\in \R^+$
-   atoms:
    -   preconditions:
        - A process $W_t$ is given as a Brownian motion.
        arguments:
        - Calculation
        outcomes:
        - $X_0=0$
        - $(X_t)_{t>0}$ is a centered Gaussian process
        - ${\rm Cov}(X_s,X_t)=\inf(s,t)$ for all $s,t>0$
    -   preconditions:
        - 'A process $(X_t)_{t>0}$ has the following properties: $X_0=0$, it is a
            centered Gaussian process, and ${\rm Cov}(X_s,X_t)=\inf(s,t)$ for all
            $s,t>0$.'
        arguments:
        - Calculation
        outcomes:
        - $W_t$ is a Brownian motion for all $t>0$
    -   preconditions:
        - 'A process $(X_t)_{t>0}$ has the following properties: $X_0=0$, it is a
            centered Gaussian process, and ${\rm Cov}(X_s,X_t)=\inf(s,t)$ for all
            $s,t>0$.'
        arguments:
        - Calculation
        outcomes:
        - $W_t$ is a Brownian motion for all $t>0$
