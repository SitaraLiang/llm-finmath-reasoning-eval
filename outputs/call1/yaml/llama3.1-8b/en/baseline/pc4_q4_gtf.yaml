subquestions:
-   atoms:
    -   preconditions:
        - "$\tau$ is a bounded stopping time"
        arguments:
        - The Stopping Time Theorem
        outcomes:
        - $\E(W_\tau) = \frac{W_0 + W_T}{2}$
        strength: 1.0
-   atoms:
    -   preconditions:
        - $(W_t)_{t\geq 0}$ is a martingale.
        - $\tau$ is a bounded stopping time.
        arguments:
        - Apply Doob's optional stopping theorem to $(W_t^2)_{t\geq 0}$ at $\tau$
        outcomes:
        - \[ \mathbb{E}[W_\tau^2] = \mathbb{E}[\tau], \]
