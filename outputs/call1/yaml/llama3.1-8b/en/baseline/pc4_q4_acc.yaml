subquestions:
-   atoms:
    -   preconditions:
        - "$\tau$ is a bounded stopping time"
        arguments:
        - Optional stopping theorem
        outcomes:
        - $\E(W_\tau) = \frac{W_T}{\sqrt{T}} \cdot \E(\sqrt{\tau})$
-   atoms:
    -   preconditions:
        - "$\tau$ is a bounded stopping time"
        arguments:
        - Calculation
        outcomes:
        - $\E(W_\tau^2) = \int_0^\infty P(\tau > t) dt$
        - $P(\tau > t) = P(W_t < \tau)$
        - $P(W_t < \tau) = \frac{1}{\sqrt{2\pi t}} \int_{-\infty}^{\tau} e^{-\frac{x^2}{2t}}
            dx$
        - $\E(W_\tau^2) = \int_0^\infty P(\tau > t) dt = \int_0^\infty \frac{1}{\sqrt{2\pi
            t}} \int_{-\infty}^{\tau} e^{-\frac{x^2}{2t}} dx dt$
        - $\E(W_\tau^2) = \int_0^\infty \frac{1}{\sqrt{2\pi t}} e^{-\frac{\tau^2}{2t}}
            dt$
        - $\E(W_\tau^2) = \tau^2$
    -   preconditions:
        - "$\tau$ is a bounded stopping time"
        arguments:
        - Calculation
        outcomes:
        - $\E(W_\tau^2) = \int_0^\infty P(\tau > t) dt$
        - $P(\tau > t) = P(W_t < \tau)$
        - $P(W_t < \tau) = 1 - P(W_t \geq \tau)$
        - $P(W_t \geq \tau) = \frac{1}{\sqrt{2\pi t}} \int_{\tau}^{\infty} e^{-\frac{x^2}{2t}}
            dx$
        - $\E(W_\tau^2) = \int_0^\infty P(\tau > t) dt = \int_0^\infty (1 - P(W_t
            \geq \tau)) dt$
        - $\E(W_\tau^2) = \int_0^\infty 1 dt - \int_0^\infty P(W_t \geq \tau) dt$
        - $\E(W_\tau^2) = \infty - \int_0^\infty P(W_t \geq \tau) dt$
        - $\E(W_\tau^2) = \infty - \frac{1}{\sqrt{2\pi}} \int_{\tau}^{\infty} e^{-\frac{x^2}{2}}
            dx$
