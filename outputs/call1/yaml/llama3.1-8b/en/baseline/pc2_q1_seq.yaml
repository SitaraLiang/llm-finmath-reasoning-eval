subquestions:
-   atoms:
    -   preconditions:
        - A process $(X_t)_{t\in \R^+}$ is given.
        arguments:
        - Calculation
        outcomes:
        - The process is a Brownian motion.
        strength: 1
    -   preconditions:
        - A process $(X_t)_{t\in \R^+}$ is given.
        arguments:
        - $X_0=0$
        - $(X_t)_{t\in \R^+}$ is a centered Gaussian process
        - ${\rm Cov}(X_s,X_t)=\inf(s,t)$
        outcomes:
        - The process is a Brownian motion.
        strength: 1
-   atoms:
    -   preconditions:
        - $W_t$ is a Brownian motion
        arguments:
        - Definition of Brownian motion
        - Calculation
        outcomes:
        - $\{X_t=t\;W_{\frac 1t}, t>0, X_0=0 \}$ is a Brownian motion too
        strength: 1.0
