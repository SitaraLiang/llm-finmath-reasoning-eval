subquestions:
-   atoms:
    -   preconditions:
        - "$\tau$ is a bounded stopping time"
        arguments:
        - Ito's Lemma
        outcomes:
        - $\E(W_\tau) = \int_{-\infty}^{\infty} W_s d\Pi(s)$
        - $\E(W_\tau) = 0$
-   atoms:
    -   preconditions:
        - "$\tau$ is a bounded stopping time"
        arguments:
        - Itô's formula for $W_t^2$
        outcomes:
        - $\E(W_\tau^2) = \E(W_0^2) + 2\E\left[\int_{0}^{\tau} W_s dW_s\right] + \E\left[W_\tau^2
            - W_0^2 - 2\int_{0}^{\tau} W_s dW_s\right]
        strength: 1
    -   preconditions:
        - "$\tau$ is a bounded stopping time"
        arguments:
        - Martingale property of $W_t$
        - Itô's formula for $W_t^2$
        outcomes:
        - $\E(W_\tau^2) = \E(W_0^2)$
