subquestions:
-   atoms:
    -   preconditions:
        - A process $(X_t)_{t\in \R^+}$ is given.
        arguments:
        - Calculation
        outcomes:
        - $X_0=0$
    -   preconditions:
        - $X_0=0$
        - $(X_t)_{t\in \R^+}$ is a centered Gaussian process
        - ${\rm Cov}(X_s,X_t)=\inf(s,t)$ for all $s,t\in \R^+$
        arguments:
        - Calculation
        outcomes:
        - $X_0=0$
    -   preconditions:
        - $X_0=0$
        - $(X_t)_{t\in \R^+}$ is a centered Gaussian process
        - ${\rm Cov}(X_s,X_t)=\inf(s,t)$ for all $s,t\in \R^+$
        arguments:
        - Calculation
        outcomes:
        - $X_0=0$ and $(X_t)_{t\in \R^+}$ is a Brownian motion
    -   preconditions:
        - $X_0=0$ and $(X_t)_{t\in \R^+}$ is a Brownian motion
        arguments:
        - Calculation
        outcomes:
        - ${\rm Cov}(X_s,X_t)=\inf(s,t)$ for all $s,t\in \R^+$
    -   preconditions:
        - $X_0=0$ and $(X_t)_{t\in \R^+}$ is a Brownian motion
        arguments:
        - Calculation
        outcomes:
        - $(X_t)_{t\in \R^+}$ is a centered Gaussian process
-   atoms:
    -   preconditions:
        - W_t is a Brownian motion
        arguments:
        - Calculation
        outcomes:
        - '{X_t=t\;W_{\frac 1t}, t>0, X_0=0} is a Brownian motion'
        strength: 1.0
    -   preconditions:
        - W_t is a Brownian motion
        arguments:
        - Calculation
        outcomes:
        - '{X_t=t\;W_{\frac 1t}, t>0, X_0=0} has independent increments'
        strength: 1.0
    -   preconditions:
        - '{X_t=t\;W_{\frac 1t}, t>0, X_0=0} has independent increments'
        - '{X_t=t\;W_{\frac 1t}, t>0, X_0=0} is a Gaussian process'
        arguments:
        - Calculation
        outcomes:
        - '{X_t=t\;W_{\frac 1t}, t>0, X_0=0} has stationary increments'
        strength: 1.0
    -   preconditions:
        - '{X_t=t\;W_{\frac 1t}, t>0, X_0=0} has stationary increments'
        - '{X_t=t\;W_{\frac 1t}, t>0, X_0=0} is a centered Gaussian process'
        arguments:
        - Calculation
        outcomes:
        - '{X_t=t\;W_{\frac 1t}, t>0, X_0=0} has continuous paths'
        strength: 1.0
    -   preconditions:
        - '{X_t=t\;W_{\frac 1t}, t>0, X_0=0} has continuous paths'
        - '{X_t=t\;W_{\frac 1t}, t>0, X_0=0} is a Gaussian process'
        arguments:
        - Calculation
        outcomes:
        - '{X_t=t\;W_{\frac 1t}, t>0, X_0=0} is a Brownian motion'
        strength: 1.0
