        - A process (X_t)_{t\in \R^+} is given.
        arguments:
        - Brownian motion
        outcomes:
        - The process (X_t)_{t\in \R^+} is a Brownian motion if and only if X_0=0,
            (X_t)_{t\in \R^+} is a centered Gaussian process, and Cov(X_s,X_t)=inf(s,t).
-   atoms:
    -   preconditions:
        - W_t is a Brownian motion
        arguments:
        - Stochastic integral S_t = ∫[0,t]ds satisfies the equation X_s = sW_s + (s-1)dS_s
        outcomes:
        - X_t=tW_{\frac 1t} is a Brownian motion too
