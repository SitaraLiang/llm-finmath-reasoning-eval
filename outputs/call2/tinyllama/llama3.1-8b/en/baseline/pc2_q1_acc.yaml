-   atoms:
    -   preconditions:
        - A stochastic process (X_t)_{t\in \R^+} is given.
        arguments:
        - The process has the same law as the standard Gaussian process.
        outcomes:
        - (X_t)_{t\in \R^+} is a Brownian motion if and only if it satisfies certain
            properties.
-   atoms:
    -   preconditions:
        - If W_t is a Brownian motion
        arguments:
        - Martingale property of Brownian motion
        outcomes:
        - Then {X_t=t\;W_{\frac 1t}, t>0, X_0=0} is a Brownian motion too
-   atoms:
    -   preconditions:
        - The process $(X_t)_{t\in \R^+}$ satisfies $X_0=0$.
        - The process $(X_t)_{t\in \R^+}$ is a centered Gaussian process with covariance
            function ${\rm Cov}(X_s,X_t)=\inf(s,t)$ for every $s,t\ge 0$.
        arguments:
        - Brownian motion conditions
        outcomes:
        - The process $(X_t)_{t\in \R^+}$ is a Brownian motion.
