subquestions:
-   atoms:
    -   preconditions:
        - X_0=0
        - (X_t)_{t\in \R^+} 为零均值高斯过程（centered Gaussian process）
        arguments:
        - 根据定义，对于零均值高斯过程：(X_t)_{t\in \R^+} 为 centered Gaussian process，(X_{t-s})_{t\in
            \R^+} 为零均值高斯过程（centered Gaussian process），所以 Cov(X_s,X_t)=\inf(s,t)
        outcomes:
        - Cov(X_s,X_t)=\inf(s,t)
    -   preconditions:
        - X_0=0
        - (X_t)_{t\in \R^+} 为零均值高斯过程（centered Gaussian process）
        arguments:
        - 根据定义，对于零均值高斯过程：(X_t)_{t\in \R^+} 为 centered Gaussian process，(X_{t-s})_{t\in
            \R^+} 为零均值高斯过程（centered Gaussian process），所以 Cov(X_s,X_t)=\inf(s,t)
        outcomes:
        - Cov(X_s,X_t)=\inf(s,t)
-   atoms:
    -   preconditions:
        - $W_t$ 为布朗运动
        arguments:
        - 由于 $ \frac{dX}{dt} = 0 $，我们有 $ W_t = \int_0^t W_{\tau} d\tau $
        outcomes:
        - $ W_t = W_0 \cdot e^{\int_0^t \log(1 - e^{-\rho t}) d\rho} $
    -   preconditions:
        - $ W_t $ 为布朗运动
        arguments:
        - 从其中可知：$ W_t = \exp(\frac{1}{2}t\log(1 - e^{-t})) $
        outcomes:
        - $ W_t $ 是 Gaussian random variable
    -   preconditions:
        - $ X_t = t \; W_{\frac{1}{t}} $
        arguments:
        - $ \{X_s = s \; W_\phi, s > 0, X_0 = 0\} $ 等价于 $ V(t) = t \cdot W_t $
        outcomes:
        - 时间反转变换为对总能量的减法（负号）运算
