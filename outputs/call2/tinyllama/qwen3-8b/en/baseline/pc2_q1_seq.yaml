-   atoms:
    -   preconditions:
        - X_0 = 0
        - (X_t)_{t \in \R^+} is a centered Gaussian process
        - Cov(X_s, X_t) = \inf(s,t)
        arguments:
        - Brownian motion characterization
        outcomes:
        - Process (X_t)_{t \in \R^+} is a Brownian motion
-   atoms:
    -   preconditions:
        - Let $W_t$ be a Brownian motion.
        - Let $X_t = t\;W_{\frac{1}{t}}$ for $t > 0$ and $X_0 = 0$.
        arguments:
        - Define $X_t = t\;W_{\frac{1}{t}}$ for $t > 0$ and $X_0 = 0$.
        outcomes:
        - $X_t$ is a Brownian motion.
-   atoms:
    -   preconditions:
        - To solve Question 2, we will use the concept of stochastic integrals (also
            known as the Itô formula). This formula allows us to write the differential
            equation for $X_t=t\;W_1$ in terms of a stochastic process, namely $W_1$,
            and a deterministic time parameter, denoted by $\tau$.
        arguments:
        - Calculation
        outcomes:
        - The equation for $X$ can be written in terms of a Brownian motion and a
            deterministic time parameter $\tau$.
    -   preconditions:
        - 'Let''s begin by writing the differential equation for $X_t$:'
        arguments:
        - Calculation
        outcomes:
        - $dx_t = v_t dt + \sqrt{2}\sigma dW_{\frac1{\tau}}$
    -   preconditions:
        - 'Now, let''s substitute this expression into the stochastic integral equation
            for $X$ with the Brownian motion:'
        arguments:
        - Calculation
        outcomes:
        - $dX_{t}=v_{t}dt+\sqrt{2}\sigma d\left(\int_0^\infty e^{-\frac1{\tau^2}(t-s)}ds\right)
            + \sqrt{2}\sigma dW_{\frac1{\tau}}$
    -   preconditions:
        - 'By the Itô formula, we have:'
        arguments:
        - Calculation
        outcomes:
        - $dX_{t}=v_{t}dt+\sqrt{2}\sigma dW_1 + \sqrt{2}\sigma d(X_t-t\int_0^1 e^{-\frac1{t^2}(s-u)}du)$
    -   preconditions:
        - 'Thus, the equation for $X$ can be written in terms of a Brownian motion
            and a deterministic time parameter $\tau$:'
        arguments:
        - Calculation
        outcomes:
        - $dX_{\tau}=v_{\tau}dt+\sqrt{2}\sigma d\left(\int_0^\infty e^{-\frac1{\tau^2}(t-s)}ds\right)
            + \sqrt{2}\sigma d(X_\tau - \tau\int_0^\tau e^{-\frac1{t^2}(s-\frac1{t})}dW_1)$
    -   preconditions:
        - Since $X_t=t\;W_{\frac 1t}$, this is the same equation as before.
        arguments:
        - Calculation
        outcomes:
        - $X$ is a Brownian motion.
