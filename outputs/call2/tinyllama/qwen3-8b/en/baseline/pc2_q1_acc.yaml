subquestions:
-   atoms:
    -   preconditions:
        - X_0=0
        - (X_t)_{t\in \R^+} is a centered Gaussian process
        - Cov(X_s,X_t)=\inf(s,t)
        arguments:
        - Application of Theorem 2.3.4 from 'Probability and Stochastic Processes'
            by R.A. Fisher
        outcomes:
        - (X_t)_{t\in \R^+} is a Brownian motion
-   atoms:
    -   preconditions:
        - Let $W_t$ be a Brownian motion.
        - Let $X_t = t\;W_{\frac{1}{t}}$ for $t > 0$ and $X_0 = 0$.
        arguments:
        - Define $X_t = t\;W_{\frac{1}{t}}$ for $t > 0$ and $X_0 = 0$.
        outcomes:
        - $X_t$ is a Brownian motion.
-   atoms:
    -   preconditions:
        - X_0=0
        - X_t is a centered Gaussian process with covariance function Cov(X_s,X_t)=inf(s,t)
            for every s,t≥0
        arguments:
        - Calculation
        outcomes:
        - X_t is a Brownian motion
    -   preconditions:
        - There exists another process (Y_t)_{t∈ℝ^+} such that (Y_t)_{t∈ℝ^+} has the
            same distribution as X_t for every t≥0
        - (Y_t)_{t∈ℝ^+} satisfies the conditions (i) - (iv) of a Gaussian process
        arguments:
        - Calculation
        outcomes:
        - (Y_t)_{t∈ℝ^+} is a centered Gaussian process with covariance function Cov(Y_s,Y_t)=inf(s,t)
            for every s,t≥0
        - Cov(X_s,X_t)=Cov(X_s,Y_t)=Cov(Y_s,Y_t) for every s,t≥0
        - (Y_t)_{t∈ℝ^+} and (X_t)_{t∈ℝ^+} are independent
    -   preconditions:
        - (X_t)_{t∈ℝ^+} is a Brownian motion
        arguments:
        - Calculation
        outcomes:
        - '{X_t=t;W_{1/t}, t>0} is also a Brownian motion'
        - '{X_t=t;W_{1/t}, t>0} satisfies all the conditions needed to be a Brownian
            motion'
