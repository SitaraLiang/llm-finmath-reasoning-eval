-   atoms:
    -   preconditions:
        - W_t is a Brownian motion
        - X_t = t W_{1/t}, X_0 = 0
        arguments:
        - Assume that X_t does not satisfy the Brownian motion assumption
        outcomes:
        - Find an infinite sequence (t_n) and a sequence (ξ_n) such that X_{t_n} converges
            in law to W(t), (X_{t_n} - X_{t_{n+1}})^2 converges in law to 0, and ∑^N_{n=1}
            (ξ_{n+1} - ξ_n)^2 converges in law to 0
    -   preconditions:
        - Brownian motion is a continuous process
        arguments:
        - Find a subsequence (t_m) and a random variable (η_n) such that lim_{n→∞}
            t_m = T and (ξ_n) converges in law to W(T)
        outcomes:
        - ∑^N_{n=1} (η_n)^2 converges in law to 0 for all N ≥ 1
    -   preconditions:
        - (t_m) is an increasing sequence of positive numbers converging to T
        arguments:
        - t_m = t_{m+1}/2^m for all m ∈ ℕ
        outcomes:
        - lim_{n→∞} (η_{n+1} - η_n)^2 converges in law to 0 for all n
    -   preconditions:
        - lim_{n→∞} (η_{n+1} - η_n)^2 converges in law to 0 for all n
        arguments:
        - Contradicts the assumption that X_0 = 0 satisfies the Brownian motion assumption
        outcomes:
        - Therefore, X_t satisfies the Brownian motion assumption
