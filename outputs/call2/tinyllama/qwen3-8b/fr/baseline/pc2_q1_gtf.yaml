        outcomes:
        - X_t est un mouvement brownien
        strength: 1
    -   preconditions:
        - W_t est un mouvement brownien
        - t > 0
        - X_0 = 0
        arguments:
        - X_t = t \cdot W_{\frac{1}{t}}
        outcomes:
