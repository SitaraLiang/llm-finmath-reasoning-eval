        - X_0 = 0
        - X_t 是零均值高斯过程
        - 协方差函数 Cov(X_s, X_t) = min(s, t)
        outcomes:
        - X_0 = 0
        - X_t 是零均值高斯过程
        - Cov(X_s, X_t) = min(s, t)
-   atoms:
    -   preconditions:
        - $ W_t $ 为布朗运动
        - $ t > 0 $
        - $ X_0 = 0 $
        arguments:
        - $ X_t = t\,W_{1/t} $
        - $ E[X_t] = 0 $
        - $ \text{Cov}(X_s, X_t) = \min(s, t) $
