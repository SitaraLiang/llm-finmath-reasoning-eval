subquestions:
-   atoms:
    -   preconditions:
        - A process $(X_t)_{t\in \R^+}$ is a Brownian motion.
        arguments:
        - Brownian motion definition
        outcomes:
        - X_0=0 and ${\rm Cov}(X_s,X_t)=\inf(s,t)$
    -   preconditions:
        - A process $(X_t)_{t\in \R^+}$ is a centered Gaussian process.
        arguments:
        - Centered Gaussian process definition
        outcomes:
        - X_0=0 and ${\rm Cov}(X_s,X_t)=\inf(s,t)$
    -   preconditions:
        - A process $(X_t)_{t\in \R^+}$ is a centered Gaussian process with covariance
            matrix $\sigma^2 I$.
        arguments:
        - Covariance matrix definition
        outcomes:
        - ${\rm Cov}(X_s,X_t)=\sqrt{s-t}$
-   atoms:
    -   preconditions:
        - W_t is a Brownian motion
        arguments:
        - Ito's Lemma and properties of Brownian motion
        outcomes:
        - X_t = t W_{\frac 1t} is a Brownian motion too
