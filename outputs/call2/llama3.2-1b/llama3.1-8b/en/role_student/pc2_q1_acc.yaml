-   atoms:
    -   preconditions:
        - 'A stochastic process (X_t)_{t\in \R^+} is called a Brownian motion if it
            satisfies the following properties:'
        - It starts at zero, i.e., X_0=0.
        - It has continuous paths.
        - For any s < t, the increment X_t - X_s is normally distributed with mean
            0 and variance t-s.
        arguments:
        - Definition of a Brownian Motion
        outcomes:
        - The process (X_t)_{t\in \R^+} is a Brownian motion too.
