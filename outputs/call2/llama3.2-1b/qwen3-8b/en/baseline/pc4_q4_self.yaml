subquestions:
-   atoms:
    -   preconditions:
        - When $\tau$ is a bounded stopping time
        arguments:
        - Calculation
        outcomes:
        - $\E(W_\tau) = \int_0^\infty e^{-\frac{t}{2}} \mathbb{P}(\tau < t) dt$
    -   preconditions:
        - $\mathbb{P}(\tau < t) = \mathbb{F}_t^W$
        arguments:
        - Calculation
        outcomes:
        - 'Using the Burkholder-Davis-Gundy (BdG) inequality, we have: $$\E[|W_\tau|^2]
            \leq C_t \left( \int_0^\infty |W_s|^2 ds + \int_0^\infty (\mathbb{F}_s^W)(t)
            dt\right)$$'
    -   preconditions:
        - Since $\tau$ is a bounded stopping time
        arguments:
        - Calculation
        outcomes:
        - $$\E[|W_\tau|^2] = \int_0^\infty \mathbb{P}(\tau < t) dt = 1$$
    -   preconditions:
        - $$\int_0^\infty (\mathbb{F}_t^W)(t) dt = \lim_{T \to \infty} \frac{1}{2}
            \left( \int_0^{T-1} W_s dW_s + \int_T^{\infty} (dW_s - dB_s)\right)$$
        arguments:
        - Calculation
        outcomes:
        - 'Using the properties of Brownian motion, we have: $$\int_0^{T-1} W_s dW_s
            = 0$$ and $$\int_T^{\infty} (dW_s - dB_s) = \left( B_t - t \right)^2$$'
    -   preconditions:
        - Substituting these expressions into the previous equation
        arguments:
        - Calculation
        outcomes:
        - $$\E[|W_\tau|^2] = \frac{1}{2} \lim_{T \to \infty} \left( T + 2(T-t) \int_T^{\infty}
            (dB_s - W_s dW_s)\right)$$
    -   preconditions:
        - $$\int_T^{\infty} (dB_s - W_s dW_s)$$ is a martingale
        arguments:
        - Calculation
        outcomes:
        - $$\E[|W_\tau|^2] = \frac{1}{2} \lim_{T \to \infty} T + 2(T-t) \E[M_T]$$
            where $M$ is a martingale
    -   preconditions:
        - Since $\tau$ is a bounded stopping time
        arguments:
        - Calculation
        outcomes:
        - $$\E[M_T] = 0$$
    -   preconditions:
        - $$\E[|W_\tau|^2] = \frac{T}{2}$$
        arguments:
        - Calculation
        outcomes:
        - $$\E[W_\tau] = \int_0^\infty e^{-\frac{t}{2}} \mathbb{P}(\tau < t) dt =
            \sqrt{\frac{\pi}{4}} \int_0^\infty e^{-\frac{t}{2}} dt = \frac{1}{\sqrt{2}}$$
