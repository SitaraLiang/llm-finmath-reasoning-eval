subquestions:
-   atoms:
    -   preconditions:
        - $\tau$ is a bounded stopping time
        arguments:
        - Calculation
        outcomes:
        - $\E(W_\tau) = \int_0^\infty W_s dW_s$
-   atoms:
    -   preconditions:
        - When $\tau$ is a bounded stopping time
        arguments:
        - Calculation
        outcomes:
        - $\E(W_\tau^2) = \int_0^\infty (1 - e^{-2s})\sigma^2 ds$
    -   preconditions:
        - Since $W_t$ is a Brownian Motion
        arguments:
        - Calculation
        outcomes:
        - $\E(W_{\tau+h}^2) - \E(W_\tau^2) = \int_0^\infty (W_s - W_\tau)\sigma^2
            ds + \int_0^\tau B_u dB_u + \int_{\tau}^{h} (\E(B_u))^2 du$
    -   preconditions:
        - Since $B_t$ is a Gaussian Process with covariance function $\Cov(B_s, B_t)
            = \min(s,t)$
        arguments:
        - Calculation
        outcomes:
        - $\int_0^\infty (W_s - W_\tau)\sigma^2 ds + \int_{\tau}^{h} (\E(B_u))^2 du
            = \frac{1}{2}\sigma^2 h + h \E(B_h)$
    -   preconditions:
        - Using the Optional Stopping Theorem
        arguments:
        - Calculation
        outcomes:
        - $\int_0^\infty (W_s - W_\tau)\sigma^2 ds = \frac{1}{2}\sigma^2 (\tau-h)
            + h \E(B_h)$
    -   preconditions:
        - Since $B_t$ is a Gaussian Process
        arguments:
        - Calculation
        outcomes:
        - $\int_0^\infty (W_s - W_\tau)\sigma^2 ds = \frac{1}{2}\sigma^2 (\tau-h)$
    -   preconditions:
        - Substituting this back into the original equation
        arguments:
        - Calculation
        outcomes:
        - $\E(W_\tau^2) = \frac{1}{2}\sigma^2 (\tau-\infty) + h \E(B_h)$
