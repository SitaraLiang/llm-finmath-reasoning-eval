            X_u' - X_u)
    -   preconditions:
        - X_s' and X_u' are independent
        arguments:
        - Use independence of X_s' and X_u'
        outcomes:
        - Cov(X_s' - X_s', X_u' - X_u) = inf(s, u)
    -   preconditions:
        - W_t is a Brownian motion
