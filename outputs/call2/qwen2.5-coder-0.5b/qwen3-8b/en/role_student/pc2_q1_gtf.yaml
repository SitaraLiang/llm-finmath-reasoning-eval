subquestions:
-   atoms:
    -   preconditions:
        - A process $(X_t)_{t\in \mathbb{R}^+}$ is a Brownian motion if and only if
            $X_0=0$, $(X_t)_{t\in \mathbb{R}^+}$ is a centered Gaussian process, ${\rm
            Cov}(X_s,X_t)=\inf(s,t)$.
        arguments:
        - Proof of equivalence between Brownian motion and the given conditions
        outcomes:
        - The process is a Brownian motion if and only if $X_0=0$, $(X_t)_{t\in \mathbb{R}^+}$
            is a centered Gaussian process, and ${\rm Cov}(X_s,X_t)=\inf(s,t)$
    -   preconditions:
        - Assume $X_0=0$ and $(X_t)_{t\in \mathbb{R}^+}$ is a centered Gaussian process
        arguments:
        - Covariance properties of Gaussian processes
        outcomes:
        - Covariance matrix is constant and satisfies ${\rm Cov}(X_s,X_t)=\inf(s,t)$
    -   preconditions:
        - Assume $(X_t)_{t\in \mathbb{R}^+}$ is not a centered Gaussian process
        arguments:
        - Contradiction with covariance properties
        outcomes:
        - The variance of the difference between $X_s$ and $X_t$ is not constant,
            contradicting the given condition
    -   preconditions:
        - Assume $(X_t)_{t\in \mathbb{R}^+}$ is not a centered Gaussian process
        arguments:
        - Contradiction with covariance properties
        outcomes:
        - The variance of the difference between $X_s$ and $X_t$ is constant, implying
            Brownian motion
-   atoms:
    -   preconditions:
        - We show that $ \{X_t = t \cdot W_{\frac{1}{t}}, t > 0, X_0 = 0 \} $ is a
            Brownian motion if and only if $ X_0 = 0 $, $ (X_t)_{t \in \R^+} $ is
            a centered Gaussian process, and the covariance is bounded.
        arguments:
        - Calculation
        outcomes:
        - The solution involves decomposing $ X_t = X_s + (X_t - X_s) $. The covariance
            of this decomposition is calculated to be $ \min(s,t) $.
    -   preconditions:
        - We show that $ \{X_t = t \cdot W_{\frac{1}{t}}, t > 0, X_0 = 0 \} $ is a
            Brownian motion if and only if $ \{W_t\}, W_{\frac{1}{t}}, W_{t+1}\} $
            are independent. Additionally, the law of increments is Gaussian centered
            of variance $ t - s $, i.e., $ \mathcal{N}(0, t-s) $.
        arguments:
        - Calculation
        outcomes:
        - The solution to both questions is that $ \{X_t = t \cdot W_{\frac{1}{t}},
            t > 0, X_0 = 0 \} $ is indeed a Brownian motion if and only if $ (X_t)_{t
            \in \R^+}, \{W_t\}, W_{\frac{1}{t}}, W_{t+1}\} $ are independent.
