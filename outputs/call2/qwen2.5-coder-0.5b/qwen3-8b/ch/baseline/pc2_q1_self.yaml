    -   preconditions:
        - X_0 = 0
        - (X_t)_{t\in \R^+} 为零均值高斯过程
        - '{\rm Cov}(X_s,X_t) = \inf(s,t)'
        arguments:
        - 根据题目背景、全局假设和前面的回答，证明过程 \mathbb{P}(X_t = s|X_0 = 0) 必须是恒等式。
        outcomes:
        - X_t 和 X_0 必须在相同的时间间隔内进行随机变化，从而满足布朗运动的定义。
    -   preconditions:
        - X_0 = 0
        - (X_t)_{t\in \R^+} 为零均值高斯过程
        - '{\rm Cov}(X_s,X_t) = \inf(s,t)'
        arguments:
        - \mathbb{P}(X_t = s|X_0 = 0) = \frac{\int_{s=0}^t X_s \, ds}{\int_{0}^t dx}
            = \frac{1}{\int_{0}^t 1 \, dx} = 1
        outcomes:
        - X_t 和 X_0 必须在相同的时间间隔内进行随机变化，从而满足布朗运动的定义。
