subquestions:
-   atoms:
    -   preconditions:
        - τ 是有界停时
        - 布朗运动是连续过程
        arguments:
        - 使用伊藤公式将期望表示为积分形式
        outcomes:
        - E(W_τ) = ∫₀^τ W_s dW_s + ½∫₀^τ 1 ds
    -   preconditions:
        - 伊藤公式已应用
        arguments:
        - 将 dW_s 表示为 ½d²W_s + ½
        outcomes:
        - E(W_τ) = ½∫₀^τ W_s d²W_s + ¼∫₀^τ 1 ds
    -   preconditions:
        - 布朗运动的性质：d²W_s 是常数，等于 1/ds
        arguments:
        - 将 d²W_s 替换为 1/ds
        outcomes:
        - E(W_τ) = ¼∫₀^τ 1 ds
    -   preconditions:
        - 积分 ∫₀^τ 1 ds 等于 τ
        arguments:
        - 计算最终积分结果
        outcomes:
        - E(W_τ) = τ/2
-   atoms:
    -   preconditions:
        - 由 $\mathrm{Var}(X) = \E[X^2] - (\E[X])^2$ 给出
        arguments:
        - 由 $\mathrm{Var}(X) = \E[X^2] - (\E[X])^2$ 给出
        outcomes:
        - $\E[W_\tau^2] = \E[\mathrm{Var}(W_\tau) + (\E[W_\tau])^2]$
    -   preconditions:
        - 由前面问题的答案给出
        arguments:
        - 由前面问题的答案给出
        outcomes:
        - $\E[W_\tau^2] = \E[\mathrm{Var}(W_\tau)] + 0^2$
    -   preconditions:
        - 由 $\mathrm{Var}(X) = \E[X^2] - (\E[X])^2$ 给出
        arguments:
        - 由 $\mathrm{Var}(X) = \E[X^2] - (\E[X])^2$ 给出
        outcomes:
        - $\E[W_\tau^2] = \E[\mathrm{Var}(W_\tau)]$
    -   preconditions:
        - 由布朗运动的性质给出
        arguments:
        - 由布朗运动的性质给出
        outcomes:
        - $\E[W_\tau^2] = \frac{\tau}{T}$
