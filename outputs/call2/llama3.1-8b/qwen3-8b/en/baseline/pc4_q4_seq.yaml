-   atoms:
    -   preconditions:
        - When $\tau$ is a bounded stopping time
        arguments:
        - Calculation
        outcomes:
        - $\E(W_\tau) = 0$
-   atoms:
    -   preconditions:
        - When $\tau$ is a bounded stopping time
        arguments:
        - Calculation
        outcomes:
        - $\E(W_\tau^2) = \int_0^\infty W_t^2 \frac{\partial}{\partial t} P(\tau >
            t) dt$
    -   preconditions:
        - Since $P(\tau > t) = 1$ for all $t$
        arguments:
        - Calculation
        outcomes:
        - $\E(W_\tau^2) = \int_0^\infty W_t^2 dt$
    -   preconditions:
        - Using the properties of Brownian Motion, we know that $\E[W_t^2] = t$
        arguments:
        - Calculation
        outcomes:
        - $\E(W_\tau^2) = \int_0^\infty t dt = \frac{1}{2} \tau^2$
