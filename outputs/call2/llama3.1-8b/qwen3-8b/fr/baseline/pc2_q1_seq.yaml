-   atoms:
    -   preconditions:
        - Le mouvement brownien est un processus gaussien continu avec $B_0=0$ et
            ${\rm Cov}(B_s,B_t)=\inf(s,t)$.
        arguments:
        - Définition du mouvement brownien
        outcomes:
        - Un mouvement brownien $(B_t)_{t\in \R^+}$ est un processus gaussien continu
            avec $B_0=0$ et ${\rm Cov}(B_s,B_t)=\inf(s,t)$.
    -   preconditions:
        - Si $(X_t)_{t\in \R^+}$ est un mouvement brownien, alors par définition,
            on a $X_0=0$.
        arguments:
        - Nécessité de la condition $X_0=0$
        outcomes:
        - Si $(X_t)_{t\in \R^+}$ est un mouvement brownien, alors on a $X_0=0$.
    -   preconditions:
        - Si $(X_t)_{t\in \R^+}$ est un mouvement brownien, alors il s'agit d'un processus
            gaussien centré car le mouvement brownien est un processus gaussien.
        arguments:
        - Nécessité du processus gaussien centré
        outcomes:
        - Si $(X_t)_{t\in \R^+}$ est un mouvement brownien, alors il s'agit d'un processus
            gaussien centré.
    -   preconditions:
        - Si $(X_t)_{t\in \R^+}$ est un mouvement brownien, alors on a ${\rm Cov}(X_s,X_t)=\inf(s,t)$
            car c'est une propriété du mouvement brownien.
        arguments:
        - Nécessité de la covariance inférieure
        outcomes:
        - Si $(X_t)_{t\in \R^+}$ est un mouvement brownien, alors on a ${\rm Cov}(X_s,X_t)=\inf(s,t)$.
    -   preconditions:
        - Supposons que $X_0=0$, $(X_t)_{t\in \R^+}$ soit un processus gaussien centré
            et ${\rm Cov}(X_s,X_t)=\inf(s,t)$.
        arguments:
        - Suffisance des conditions
        outcomes:
        - Pour tout $s<t$, on a ${\rm Var}\left(\frac{X_t-X_s}{t-s}\right)=0$, donc
            $\frac{X_t-X_s}{t-s}$ est un processus gaussien centré et à variance nulle,
            donc il est constant. En particulier, on a $X_t=X_s$ pour tout $s<t$.
            Par conséquent, $(X_t)_{t\in \R^+}$ est un processus constant, ce qui
            implique que c'est un mouvement brownien.
