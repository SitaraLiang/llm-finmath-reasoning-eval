            $t$.
        arguments:
        - Definition of Brownian motion
        outcomes:
        - $X_t$ is a Brownian motion if and only if $X_0=0$, $(X_t)_{t\in \R^+}$ is
            a centered Gaussian process, and ${\rm Cov}(X_s,X_t)=\inf(s,t)$.
