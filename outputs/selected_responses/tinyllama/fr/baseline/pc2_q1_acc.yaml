        - '{\rm Cov}(X_s,X_t)=\inf(s,t)'
        outcomes:
        - Le mouvement brownien est un type particulier de processus stochastiques
            stationnaires.
    -   preconditions: []
        arguments:
        - f:(\R^+)^2\to \mathbb{R} est une fonction continue et positive
        outcomes:
        - X_t = \int_{0}^t f(s,X_s)ds
