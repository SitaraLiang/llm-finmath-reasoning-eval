            outcomes:
            - X_t = t \* W_{\frac 1t} satisfait la propriété de l'indépendance des
                temps
            - La distribution de X_t est normale avec moyenne 0 et écart-type t
    -   -   preconditions: []
            arguments:
            - X_0 = 0
            outcomes:
            - X_t = t \* W_{\frac 1t} satisfait la propriété d'initialisation à zéro
-   atoms:
    -   preconditions: []
        arguments:
        - Le processus (X_t)_{t\in \R^+} est un mouvement brownien
        outcomes:
        - Il suffit donc que W_t soit un mouvement Brownien
    -   preconditions: []
        arguments:
        - W_t est un mouvement Brownien
        outcomes:
        - X_t = tW_\tau où \tau = \frac1t
    -   preconditions: []
        arguments:
        - X_0 = 0 et W_{\frac1t}(t) = \int_0^t W_r \, dr
        outcomes:
        - Le résultat suivant est logique et ne dépasse aucun principe de la mécanique
            quantique
