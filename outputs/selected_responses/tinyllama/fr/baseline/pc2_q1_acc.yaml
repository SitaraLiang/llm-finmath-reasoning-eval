        arguments:
        - f(s,x) est continue et positif dans (\R^+)^2
        outcomes:
        - '{\rm Cov}(X_t,X_s)=\inf(s,t) = \sup(0,s-t)'
    -   preconditions: []
        arguments:
        - g(t) = \sup_{s\in (0,t)}f(s,x)
        outcomes:
        - X_t = \int_{0}^t g(s)dW_s
-   atoms:
    -   -   preconditions: []
            arguments:
