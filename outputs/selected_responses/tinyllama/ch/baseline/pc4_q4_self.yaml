        - 满足上述全局假设和局部假设的情况下
        arguments:
        - 对于 $W_t$ 为梯度方向为 +1 时的分布，该分布与 $\tau$ 无关。因此，$\E(W_\tau)$ 取值不受 $\tau$ 的影响。
        outcomes:
        - 当 $\tau$ 为有界停时，可以计算 $E[W_{\tau}]$ 和 $Var[W_{\tau}]$
    -   preconditions:
        - 当 $\tau$ 为有界停时
        arguments:
        - 由上述公式可知，当 $W_t$ 等于梯度方向为 -1 时的分布，并且 $\tau$ 为有界停时，$\E(W_\tau)$ 和 $Var[W_\tau]$
            取值不受 $\tau$ 的影响。
        outcomes:
        - 在不使用梯度方向为 -1 时的情况下，当 $W_t$ 等于梯度方向为 +1 时的分布，并且 $\tau$ 为有界停时，可以计算 $E[W_{\tau}]$
            和 $Var[W_{\tau}]$
-   atoms:
    -   preconditions:
        - W_t 为布朗运动
        arguments:
        - 当 τ 为有界停时，我们可以计算 E[W_τ^2]
        outcomes:
        - E[W_τ^2] 的值不受 τ 的影响
    -   preconditions:
        - τ 为有界停时
        arguments:
