        arguments:
        - Calculation
        outcomes:
        - $E[W_\tau] = \frac1{1-\P(t<0)}e^{CS^2/2} \sum_{n=0}^{\infty} \binom{N}{n}^2
            (-1)^n \P(\tau\le t)$
    -   preconditions:
        - Variance of $W_\tau$ is computed using Cauchy-Schwarz inequality
        arguments:
        - Calculation
        outcomes:
        - $Var[W_\tau] \le S^2 E[\sum_{k=0}^{\infty} (-1)^k \binom{N}{k}^2 e^{-(s-N)t}]\leq
            S^2 E[e^{-\frac{(s-N)^2}{4t}}]\le S^2 C^3 t$
    -   preconditions:
