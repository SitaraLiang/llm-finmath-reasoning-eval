subquestions:
-   atoms:
    -   preconditions:
        - X_0=0
        - (X_t)_{t\in \R^+} 为零均值高斯过程
        arguments:
        - 利用高斯过程的性质，我们有： Cov(X_s,X_t)=E[X_sX_t]-E[X_s]E[X_t]=0-0=0。
        outcomes:
        - 然而，这与给出的条件相矛盾。因此，我们需要找到另一种方法来证明这一点。
    -   preconditions:
        - 利用布朗运动的独立性和零均值高斯过程的性质
        arguments:
        - Cov(X_s,X_t)=E[X_sX_t]=\begin{cases} s, & \text{if } s \leq t \\ t, & \text{if
            } s > t \end{cases}=\inf(s,t).
        outcomes:
        - 因此，我们证明了如果 (X_t)_{t\in \R^+} 是布朗运动，则满足给出的条件。
    -   preconditions:
        - X_0=0
        - (X_t)_{t\in \R^+} 为零均值高斯过程
        arguments:
        - 利用给定的条件，我们有： Cov(X_s,X_t)=E[X_sX_t]=s \cdot t=\inf(s,t).
        outcomes:
        - 因此，我们证明了如果 (X_t)_{t\in \R^+} 满足给出的条件，则它一定是布朗运动。
-   atoms:
    -   preconditions:
        - $W_t$ 为布朗运动
        arguments:
        - 令 $B_t$ 为标准布朗运动，$\{X_t\}$ 的分布函数为 $F_{X_t}(x)=P(X_t \leq x) = P(tW_{\frac1t}
            \leq x) = P(W_{\frac1t} \leq \frac{x}{t}) = F_B(\frac{x}{t})$
        outcomes:
        - $F_{X_s}(x)=F_B(\frac{x}{s})$
        - $F_{X_t}(x)=F_B(\frac{x}{t})$
        - 因此，$\{X_t\}$ 的分布函数满足时间反转变换的条件，即 $F_{X_s}(x)=F_{X_t}(tx)$
