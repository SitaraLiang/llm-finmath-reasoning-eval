        arguments:
        - Variance of Brownian Motion and its behavior over time
        outcomes:
        - Constant variance does not depend on the amount of time observed
    -   preconditions:
        - \( W_t < 0 \) implies process will eventually reach negative infinity
        arguments:
        - Bounded stopping time condition and its implications for \( W_{\tau}^2 \)
        outcomes:
        - \( W_{\tau}^2 = -W_{\tau-1}^2 \)
    -   preconditions:
        - Expectation value of \( W_{\tau-1}^2 \) can be expressed in terms of standard
            normal distribution
        arguments:
        - Independence and identical distribution of processes
        outcomes:
        - \( E(W_{\tau-1}^2) = E(-W_{\tau-1}^2) \)
    -   preconditions:
        - Expectation value of \( W_{\tau-1}^2 \) can be expressed in terms of standard
            normal distribution
        arguments:
        - Independence and identical distribution of processes
        outcomes:
        - \( E(-W_{\tau-1}^2) = \int_0^{\tau} (-W_t)^2 \, dt \)
    -   preconditions:
        - Need to compute integral \( \int_0^{\tau} -W_t^2 \, dt \)
        arguments:
        - Substitution method for computing integrals
        outcomes:
        - \( E(-W_{\tau-1}^2) = -E(W_{\tau}) \int_0^{\tau} e^{-t} \, dt \)
    -   preconditions:
