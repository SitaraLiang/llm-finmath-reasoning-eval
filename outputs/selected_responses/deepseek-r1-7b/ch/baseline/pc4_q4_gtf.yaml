subquestions:
-   atoms:
    -   preconditions:
        - $\tau$ 为有界停时
        arguments:
        - 利用布朗运动的对称性，$W_\tau$ 的分布关于原点对称
        - 根据停时定理，$W_\tau$ 的期望保持初始值 $W_0 = 0$
        outcomes:
        - $\E(W_\tau) = 0$
-   atoms:
    -   preconditions:
        - $\tau$ 为有界停时
        arguments:
        - 使用 Itô 公式展开 $d(W_t^2)$
        - 得到 $d(W_t^2 - t)$ 为 martingale
        outcomes:
        - $\mathbb{E}[W_\tau^2 - \tau] = 0$
        - $\mathbb{E}[W_\tau^2] = \mathbb{E}[\tau]$
