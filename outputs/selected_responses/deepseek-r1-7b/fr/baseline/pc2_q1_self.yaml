-   atoms:
    -   preconditions:
        - Le processus $(X_t)_{t \in \R^+}$ est un mouvement brownien
        arguments:
        - Par définition, $X_0 = 0$
        outcomes:
        - Le processus $(X_t)_{t \in \R^+}$ satisfait $X_0 = 0$
    -   preconditions:
        - Le processus $(X_t)_{t \in \R^+}$ est un mouvement brownien
        arguments:
        - Les accroissements browniens sont gaussiens et centrés
        outcomes:
        - Le processus $(X_t)_{t \in \R^+}$ est un processus gaussien centré
    -   preconditions:
        - Le processus $(X_t)_{t \in \R^+}$ est un mouvement brownien
        arguments:
        - Les accroissements browniens sont non corrélés pour $s \neq t$
        outcomes:
        - ${\rm Cov}(X_s, X_t) = \inf(s, t)$
    -   preconditions:
        - Le processus $(X_t)_{t \in \R^+}$ satisfait $X_0 = 0$, est gaussien centré
            et ${\rm Cov}(X_s, X_t) = \inf(s, t)$
        arguments:
        - Les accroissements sont gaussiens et centrés
        outcomes:
        - Les accroissements sont indépendants
    -   preconditions:
        - Le processus $(X_t)_{t \in \R^+}$ satisfait $X_0 = 0$, est gaussien centré
            et ${\rm Cov}(X_s, X_t) = \inf(s, t)$
        arguments:
        - Les accroissements sont indépendants et stationnaires
        outcomes:
        - Le processus $(X_t)_{t \in \R^+}$ est un mouvement brownien
-   atoms:
    -   preconditions:
        - W_t est un mouvement brownien
        - t > 0
        - X_0 = 0
        arguments:
        - X_t = t W_{1/t}
        outcomes:
        - X_0 = 0 × W_{+∞} = 0
    -   preconditions:
        - W_t est un mouvement brownien
        - t > 0
        arguments:
        - X_t = t W_{1/t} suit une loi normale centrée
        outcomes:
        - Var(X_t) = t^2 × Var(W_{1/t}) = t^2 × (1/t) = t
    -   preconditions:
        - W_t est un mouvement brownien
        - s < t
        arguments:
        - Cov(X_s, X_t) = Cov(s W_{1/s}, t W_{1/t}) = s t × Cov(W_{1/s}, W_{1/t})
        outcomes:
        - Cov(W_{1/s}, W_{1/t}) = 0 si 1/s ≠ 1/t
        - Cov(X_s, X_t) = 0 si s ≠ t
        - Var(X_t) = t si s = t
        - Cov(X_s, X_t) = inf(s, t)
