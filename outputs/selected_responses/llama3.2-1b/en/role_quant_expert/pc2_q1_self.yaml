        - Cov(X_s,X_t)=inf(s,t)
        arguments:
        - Calculation
        outcomes:
        - X_t = X_{t-} + Y_t is a Brownian motion
        - E[X_t] = 1/2(t^2 + 3t)
-   atoms:
    -   preconditions:
        - W_t is a Brownian motion
        - X_t = t W_{1/t}, t > 0, X_0 = 0
        arguments:
        - Define Y_t = X_t - X_{t-}
        - Compute E[Y_t] and show it is a martingale
        - Use uniqueness of Girsanov process to conclude X_t is a Brownian motion
        outcomes:
