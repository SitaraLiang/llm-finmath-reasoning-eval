-   atoms:
    -   preconditions:
        - When $\tau$ is a bounded stopping time
        arguments:
        - Recall the definition of the expected value for a stochastic process
        outcomes:
        - Compute $\E(W_\tau)$
    -   preconditions:
        - Apply the properties of Brownian Motion
        arguments:
        - Brownian Motion $W_t$ has continuous paths, and for any bounded stopping
            time $\tau$, the increments $W_\tau - W_{\tau -}^-$ are independent and
            identically distributed normal random variables with mean 0 and variance
            equal to the increment's size
        outcomes:
        - Use the Optional Stopping Theorem
    -   preconditions:
        - Use the Optional Stopping Theorem
        arguments:
        - 'Optional Stopping Theorem states that for a Brownian Motion $W_t$, we have:
            $E(W_\tau) = \lim_{T \to \infty} E[W_T | W_0 = 0] = \lim_{T \to \infty}
            \frac{1}{\sqrt{T}} E(W_T)$'
        outcomes:
        - Evaluate the expectation of $W_T$
    -   preconditions:
        - Apply the Laplace transform
        arguments:
        - 'Laplace transform is applied to both sides of the equation: $\mathbb{E}(W_\tau)
            = \lim_{T \to \infty} \frac{\sqrt{T}}{(s - T)^2}$, where $s$ is a complex
            number'
        outcomes:
        - Evaluate the limit
    -   preconditions:
        - Simplify using Ito's formula
        arguments:
        - 'Ito''s formula for Brownian Motion states that: $\E(W_\tau) = \int_{-\infty}^{\infty}
            f(x|\sigma_s) x d\mathbb{P}(\theta)$, where $f(x|\sigma_s)$ is the density
            function of $W_t$ at time $\tau$, and $\mathbb{P}(\theta)$ is the probability
            measure corresponding to a bounded stopping time $\tau$'
        outcomes:
        - Simplify using the Itô's formula for Brownian Motion
    -   preconditions:
        - Evaluate the integral
        arguments:
        - 'Evaluating the integral, we get: $\E(W_\tau) = \int_{-\infty}^{\infty}
            (\frac{1}{2}x^2 + \ldots)x d\mathbb{P}(\theta)$'
        outcomes:
        - Simplify using the properties of Brownian Motion
    -   preconditions:
        - Evaluate the limit
        arguments:
        - 'Taking the limit as $T \to \infty$, we get: $\E(W_\tau) = \sigma_s$'
        outcomes:
        - 'The final answer is: $\boxed{\sigma_s}$'
-   atoms:
    -   preconditions:
