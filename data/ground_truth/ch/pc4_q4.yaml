context: ''
assumption_global:
- $W_t$ 为布朗运动。
subquestions:
-   question: 当 $\tau$ 为有界停时， 计算 $\E(W_\tau)$。
    assumptions:
    - $\tau$ 为有界停时，
    atoms:
    -   preconditions:
        - $(W_t)_{t\geq 0}$ 为鞅。
        - $\tau$ 为有界停时。
        arguments:
        - 对 $(W_t)_{t\geq 0}$ 在停时 $\tau$ 处应用 Doob 可选停时定理 (Optional Stopping Theorem)。
        outcomes:
        - \[ \mathbb{E}[W_\tau] = 0, \]
-   question: 当 $\tau$ 为有界停时， 计算 $\E(W_\tau^2)$。
    assumptions:
    - $\tau$ 为有界停时，
    atoms:
    -   preconditions:
        - $(W_t^2-t)_{t\geq 0}$ 为鞅。
        - $\tau$ 为有界停时。
        arguments:
        - 对过程 $(W_t^2-t)_{t\geq 0}$ 在时刻 $\tau$ 应用 Doob 可选停时定理 (Optional Stopping Theorem)。
        outcomes:
        - \[ \mathbb{E}[W_\tau^2] = \mathbb{E}[\tau]。 \]
