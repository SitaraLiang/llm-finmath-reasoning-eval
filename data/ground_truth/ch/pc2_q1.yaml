-   question: 证明过程 $(X_t)_{t\in \R^+}$ 为布朗运动（Brownian motion）当且仅当： $X_0=0$, $(X_t)_{t\in
        \R^+}$ 为零均值高斯过程（centered Gaussian process）, ${\rm Cov}(X_s,X_t)=\inf(s,t).$
    assumptions: []
    atoms: !!python/tuple
    -   -   preconditions:
            - 对于 \(s \leq t\)，将 $X_t$ 分解为 \(X_t = X_s + (X_t - X_s)\)。
            arguments:
            - 由 \(X_s\) 与增量 \(X_t - X_s\) 的独立性，
            outcomes:
            - \(\mathrm{Cov}(X_s, X_t) = \min(s,t)\)。
        -   preconditions:
            - 标准布朗运动具有高斯增量（Gaussian increments）且
            - \(X_0 = 0\)，
            arguments:
            - 独立高斯增量的线性组合，故其服从高斯分布。
            outcomes:
            - 因此该过程为零均值高斯过程。
    -   -   preconditions:
            - 利用性质 ${\rm Cov}(X_s,X_t)=\inf(s,t)$，
            - 对于 \(s < t \leq u < v\)，计算协方差 $\text{Cov}(X_t - X_s, X_v - X_u)$：
            arguments:
            - Calculation
            outcomes:
            - 不相交时间段的增量是不不相关的（uncorrelated），进而由于是高斯向量（Gaussian vector）可知其相互独立。
        -   preconditions:
            - 计算增量 $X_t - X_s$ 的方差：
            arguments:
            - 因此增量的分布仅依赖于时间差 \(t-s\)。
            outcomes:
            - 这表明增量具有平稳性（stationary），
            - 且服从分布 \(\mathcal{N}(0, t-s)\)。
        - !!python/tuple
            -   preconditions:
                - 不相交增量相互独立，且
                - 增量服从方差为 $t-s$ 的零均值高斯分布，即 \(\mathcal{N}(0, t-s)\)，
                arguments:
                - 加上轨道连续性（continuity of paths）假设，
                outcomes:
                - 布朗运动的经典定义。
            -   preconditions:
                - 不相交增量相互独立，且
                - 增量服从方差为 $t-s$ 的零均值高斯分布，即 \(\mathcal{N}(0, t-s)\)，
                arguments:
                - 通过 Kolmogorov 修正定理（Kolmogorov's continuity theorem）取其连续版本，
                outcomes:
                - 布朗运动的经典定义。
-   question: 证明：若 $W_t$ 为布朗运动，则 $ \{X_t=t\;W_{\frac 1t}, t>0, X_0=0 \}$ 亦为布朗运动（时间反转/时间反转变换
        Time Inversion）。
    assumptions: []
    atoms: !!python/tuple
    -   preconditions:
        - 计算 $\lim_{t \to 0^+} t W_{1/t}$：
        arguments:
        - 根据布朗运动的强大数定律（Law of large numbers）：
        outcomes:
        - $\lim_{t \to 0^+} t W_{1/t} = 0$ a.s.
    -   preconditions:
        - 对任意给定时刻 \(t_1, \dots, t_n\)，随机向量 \((X_{t_1}, \dots, X_{t_n})\)
        arguments:
        - 均为 \(W_{1/t_i}\) 的线性组合，
        outcomes:
        - 故服从零均值高斯分布。 \\
    -   preconditions: []
        arguments:
        - Calculation
        outcomes:
        - 即 $\mathbb{E}[X_t X_s] = \min(t,s)$。 \\
    -   preconditions:
        - 轨道连续性：$\lim_{t \to 0^+} X_t = 0$ a.s.，
        - 高斯性：对任意时刻集合，向量 \((X_{t_1}, \dots, X_{t_n})\) 均服从零均值高斯分布，
        - 协方差结构：$\mathbb{E}[X_t X_s] = \min(t,s)$，
        - 结合初始条件 \(X_0 = 0\)，
        arguments:
        - 由布朗运动的等价判定性质（part a 结论）
        outcomes:
        - 可知 \(X\) 亦为布朗运动。
