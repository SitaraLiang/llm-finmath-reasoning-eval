  text_a: Hence by the law of large numbers for Brownian motion
  text_b_variants:
  - The law of large numbers for a standard Brownian motion \(W_{t}\) states that the time-averaged ratio \(\frac{W_{t}}{t}\) converges to 0 almost surely as time goes to infinity.
  - This property shows that Brownian motion grows much more slowly than a linear function over time.
  - 'The Limit: The value approaches zero with a probability of 1 (almost surely).'
  - 'Time Inversion Property: The proof often uses the scaling or time-inversion symmetry of Brownian motion. If \(W_{t}\) is a Brownian motion, the process \(X_t = t W_{1/t}\) (for t > 0) is also a Brownian motion'
  - 'Rewriting \(\frac{W_{t}}{t}\) via time inversion as \(uW_{1/u}\) (where u = 1/t) shows that as t → ∞, it equates to evaluating the new Brownian motion at u → 0⁺, which equals 0.'
