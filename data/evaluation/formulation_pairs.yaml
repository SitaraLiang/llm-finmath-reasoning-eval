- id: sem_0007_equivalent
  type: semantic
  label: equivalent
  concept: kolmogorov_continuity_theorem
  search_hint: Kolmogorov continuity theorem continuous modification stochastic process
  source_statement_id: sem_0007
  text_a: by taking the continuous version via Kolmogorov's theorem
  text_b_variants:
  - the Kolmogorov continuity theorem is a theorem that guarantees that a stochastic process that satisfies certain constraints on the  moments  of its increments will be continuous
  - Kolmogorov--Arnold representation theorem states that any continuous multivariate function can be exactly decomposed into a finite composition
  - Kolmogorov's continuity theorem ensures a modification \(Y\) is continuous and equals \(X_{t}\) almost surely for each \(t\), but it does not give a single full-measure set where sample paths are continuous.
  - The Kolmogorov continuity theorem gives conditions under which a stochastic process whose state space is a Polish space has a continuous modifi- cation. This is like the Sobolev lemma,
  - The Kolmogorov continuity theorem, also known as the Kolmogorov–Chentsov theorem, is a fundamental result in probability theory that provides sufficient moment conditions on the increments of a stochastic process to guarantee the existence of a continuous modification—a version of the process with almost surely continuous sample paths.
  - for a real-valued stochastic process $ (X_t)_{t \in [0,1]} $, if there exist positive constants $ \alpha > 0 $, $ \beta > 0 $, and $ C > 0 $ such that $ \mathbb{E}[|X_t - X_s|^\alpha] \leq C |t - s|^{1 + \beta} $ for all $ s, t \in [0,1] $, then $ X $ admits a continuous version on $ [0,1] $
  - 'the Kolmogorov–Arnold representation theorem (or superposition theorem) states that every multivariate continuous function  f : [ 0 , 1 ] n → R {\displaystyle f\colon [0,1]^{n}\to \mathbb {R} } can be represented as a superposition of continuous single-variable functions.'
  - if f is a multivariate continuous function, then f can be written as a finite composition of continuous functions of a single variable and the binary operation of addition.
