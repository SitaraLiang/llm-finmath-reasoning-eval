  concept: brownian_motion
  search_hint: Brownian motion definition stochastic process
  source_statement_id: sem_0001
  text_a: $W_t$ is a Brownian Motion.
  text_b_variants:
  - 'A standard Brownian motion (or Wiener Process) is a continuous-time stochastic process \(W_{t}\) defined for all times \(t \ge 0\) characterized by four core properties: starting at zero, independent increments, normally distributed changes, and continuous paths'
  - 'A real-valued stochastic process \(\{W_t\}_{t \ge 0}\) is a standard Brownian motion if it satisfies the following rules: '
  - 'Initial Value: \(W_0 = 0\) with a probability of 1.'
  - 'Independent Increments: For any times \(0 \le t_1 < t_2 < \dots < t_n\), the changes (increments) \(W_{t_2} - W_{t_1}, W_{t_3} - W_{t_2}, \dots\) are independent random variables. '
  - 'Gaussian Increments: For any \(s < t\), the change \(W_t - W_s\) follows a normal distribution with a mean of 0 and a variance equal to the time difference \(t - s\) (i.e., \(\mathcal{N}(0, t - s)\)). '
  - 'Path Continuity: The function \(t \mapsto W_t\) is continuous in \(t\) with probability 1.'
