  search_hint: Doob optional stopping theorem bounded stopping time martingale
  source_statement_id: sem_0012
  text_a: Apply Doob's optional stopping theorem to $(W_t)_{t\geq 0}$ at $\tau$
  text_b_variants:
  - In probability theory, the optional stopping theorem (or sometimes Doob's optional sampling theorem) says that, under certain conditions, the expected value of a martingale at a stopping time is equal to its initial expected value.
  - Doob's optional stopping theorem states that for a martingale and a bounded stopping time, the expected value at the stopping time equals the initial expected value, meaning \(E[X_T] = E[X_0]\). This fundamental rule applies when the stopping time is less than a fixed number
  - 'Equal Expectation: If \((X_n)\) is a martingale and T is a stopping time bounded by a fixed number k (T ≤ k a.s.), then \(E[X_T] = E[X_0]\).'
  - 'Conditional Property: For two bounded stopping times S ≤ T, the conditional property holds as \(E[X_T \mid \mathcal{F}_S] = X_S\).'
